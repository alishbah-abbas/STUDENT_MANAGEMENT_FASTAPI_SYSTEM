<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-online {
            background-color: #28a745;
        }
        .status-offline {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-graduation-cap me-2"></i>
                Student Management System
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <span id="api-status" class="status-indicator status-offline"></span>
                    API Status: <span id="api-status-text">Checking...</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- API Status Alert -->
        <div id="api-alert" class="alert alert-warning alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <strong>Note:</strong> Make sure your FastAPI backend is running on <code>http://127.0.0.1:8000</code>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Students Section -->
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-user-plus me-2"></i>Add Student
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="student-form">
                            <div class="mb-3">
                                <label for="student-name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="student-name" required>
                            </div>
                            <div class="mb-3">
                                <label for="student-email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="student-email" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-plus me-2"></i>Add Student
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Courses Section -->
                <div class="card mt-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-book-plus me-2"></i>Add Course
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="course-form">
                            <div class="mb-3">
                                <label for="course-title" class="form-label">Course Title</label>
                                <input type="text" class="form-control" id="course-title" required>
                            </div>
                            <div class="mb-3">
                                <label for="course-description" class="form-label">Description</label>
                                <textarea class="form-control" id="course-description" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-plus me-2"></i>Add Course
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <!-- Students List -->
                <div class="card">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-users me-2"></i>Students
                        </h5>
                        <button class="btn btn-light btn-sm" onclick="loadStudents()">
                            <i class="fas fa-refresh me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="students-list">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Loading students...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Courses List -->
                <div class="card mt-4">
                    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-book me-2"></i>Courses
                        </h5>
                        <button class="btn btn-dark btn-sm" onclick="loadCourses()">
                            <i class="fas fa-refresh me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="courses-list">
                            <div class="text-center">
                                <div class="spinner-border text-warning" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Loading courses...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Enrollments Section -->
                <div class="card mt-4">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-user-graduate me-2"></i>Enroll Student in Course
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="enrollment-form">
                            <div class="row">
                                <div class="col-md-5">
                                    <label for="enrollment-student" class="form-label">Select Student</label>
                                    <select class="form-select" id="enrollment-student" required>
                                        <option value="">Choose student...</option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label for="enrollment-course" class="form-label">Select Course</label>
                                    <select class="form-select" id="enrollment-course" required>
                                        <option value="">Choose course...</option>
                                    </select>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="submit" class="btn btn-secondary w-100">
                                        <i class="fas fa-link me-1"></i>Enroll
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <div id="enrollments-list" class="mt-4">
                            <!-- Enrollments will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i id="toast-icon" class="fas fa-info-circle text-primary me-2"></i>
                <strong class="me-auto" id="toast-title">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message">
                Message here
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
